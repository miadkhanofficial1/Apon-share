name: "Release Multi-Platform & OTA"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest"
            target: "x86_64-pc-windows-msvc"
            args: ""
          - platform: "macos-latest"
            target: "aarch64-apple-darwin,x86_64-apple-darwin"
            args: "--target universal-apple-darwin"
          - platform: "ubuntu-22.04"
            target: "x86_64-unknown-linux-gnu"
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "app/package-lock.json"

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libasound2-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "app/src-tauri -> target"

      - name: Install Frontend Dependencies
        working-directory: ./app
        run: npm ci

      - name: Build and Sign Tauri Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: "./app"
          tagName: ${{ github.ref_name }}
          releaseName: "Apon ${{ github.ref_name }}"
          releaseBody: "Instant. Private. Yours. Automated release for Apon ${{ github.ref_name }} with cross-platform installers and OTA updates."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
          includeUpdaterJson: true
          updaterJsonKeepUniversal: true

  release-android:
    needs: release-desktop
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: 17

      - name: Setup Android SDK & NDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_HOME/build-tools/34.0.0" >> $GITHUB_PATH

          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.3.11579264"

          echo "NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> $GITHUB_ENV

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "app/package-lock.json"

      - name: Setup Rust Toolchain & Android Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: "aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android"

      - name: Install Frontend Dependencies
        working-directory: ./app
        run: npm ci

      - name: Build Android APK
        working-directory: ./app
        run: |
          if [ ! -d "src-tauri/gen/android" ]; then
            npm run tauri android init
          fi
          npm run tauri android build -- --apk

      - name: Sign Release Android APK
        run: |
          keytool -genkeypair -v -keystore release.keystore -alias apon -keyalg RSA -keysize 2048 -validity 10000 -storepass aponrelease2026 -keypass aponrelease2026 -dname "CN=Apon, OU=MK.Studio, O=MK.Studio, L=Dhaka, S=Dhaka, C=BD"
          UNSIGNED_APK=$(find app/src-tauri/gen/android/app/build/outputs/apk -name "*unsigned.apk" -o -name "*.apk" | head -n 1)
          echo "Found APK to sign: $UNSIGNED_APK"
          if [ -z "$UNSIGNED_APK" ]; then
            echo "Error: No APK found to sign!"
            exit 1
          fi
          $ANDROID_HOME/build-tools/34.0.0/zipalign -v -p 4 "$UNSIGNED_APK" aligned.apk
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign --ks release.keystore --ks-pass pass:aponrelease2026 --out Apon-1.0.0-universal.apk aligned.apk
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --verbose Apon-1.0.0-universal.apk

      - name: Upload Android APK to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            Apon-1.0.0-universal.apk
            app/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
