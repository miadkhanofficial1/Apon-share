[package]
name = "apon"
version = "1.0.0"
description = "Apon - Instant, Private, Cross-Platform File Sharing App"
authors = ["MD. MIAD IBNA NOOR <miadkhan.official1@gmail.com>"]
edition = "2021"

[lib]
name = "apon_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "~2.12.0", features = [] }

[dependencies]
tauri = { version = "~2.12.0", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
local-ip-address = "0.6"
uuid = { version = "1", features = ["v4"] }
mdns-sd = "0.13"
sha2 = "0.10"
tauri-plugin-updater = "~2.14.0"
tauri-plugin-process = "~2.4.0"

