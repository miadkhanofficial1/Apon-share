[package]
name = "apon"
version = "1.0.0"
description = "Apon - Instant, Private, Cross-Platform File Sharing App"
authors = ["MD. MIAD IBNA NOOR <miadkhan.official1@gmail.com>"]
edition = "2021"

[lib]
name = "apon_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["tray-icon"] }
tauri-plugin-opener = "2.0.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
