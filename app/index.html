<!doctype html>
<html lang="en" class="h-full select-none">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />

    <!-- Inline FOUC Prevention Script (Strict Light Mode Default) -->
    <script>
      (function() {
        try {
          const stored = localStorage.getItem('theme');
          const isDark = stored === 'dark';
          if (isDark) {
            document.documentElement.classList.add('dark');
            const meta = document.querySelector('meta[name="color-scheme"]');
            if (meta) meta.content = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            const meta = document.querySelector('meta[name="color-scheme"]');
            if (meta) meta.content = 'light';
          }
        } catch (e) {}
      })();
    </script>

    <title>Apon — Instant. Private. Yours.</title>
  </head>
  <body class="h-full bg-white dark:bg-[#090D16] text-slate-800 dark:text-slate-200 antialiased overflow-hidden transition-colors duration-150">
    <div id="root" class="h-full flex flex-col"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
